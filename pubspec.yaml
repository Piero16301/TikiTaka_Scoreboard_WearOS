name: tiki_taka_scoreboard_wearos
description: WearOS application for Tiki-Taka system for real-time scoreboard.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.35.6"

dependencies:
  bloc: ^9.2.0
  cloud_firestore: ^6.1.2
  device_info_plus: ^12.3.0
  equatable: ^2.0.8
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.1
  google_fonts: ^8.0.2
  http: ^1.6.0
  hugeicons: ^1.1.5
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.4
  shimmer_animation: ^2.2.2
  text_scroll: ^0.2.1
  vector_graphics: ^1.1.19
  vector_graphics_compiler: ^1.2.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.11.1
  fake_cloud_firestore: ^4.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mockito: ^5.6.3
  mocktail: ^1.0.4
  test_coverage_badge: ^0.3.2
  very_good_analysis: ^10.2.0

flutter_launcher_icons:
  android: "ic_logo"
  image_path_android: "assets/app-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app-logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/app-logo.png
