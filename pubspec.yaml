name: tiki_taka
description: WearOS application for Tiki-Taka system for real-time scoreboard.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  bloc: ^9.0.0
  cloud_firestore: ^5.6.6
  dash_flags: ^0.1.1
  equatable: ^2.0.7
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_local_notifications: ^19.1.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.3.0
  hugeicons: ^0.0.10
  intl: ^0.19.0
  rotary_scrollbar: ^1.1.0
  shared_preferences: ^2.5.3
  text_scroll: ^0.2.0
  user_api:
    path: packages/user_api
  user_api_remote:
    path: packages/user_api_remote
  user_repository:
    path: packages/user_repository
  vector_graphics: ^1.1.18
  vector_graphics_compiler: ^1.1.16
  wearable_rotary: ^2.0.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  mockito: ^5.4.5
  mocktail: ^1.0.4
  very_good_analysis: ^7.0.0

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  image_path_android: "assets/logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.png
