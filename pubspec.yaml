name: tiki_taka_scoreboard_wearos
description: WearOS application for Tiki-Taka system for real-time scoreboard.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  auto_size_text: ^3.0.0
  bloc: ^9.2.1
  cached_network_image: ^4.0.5
  cloud_firestore: ^7.1.0
  device_info_plus: ^13.3.0
  equatable: ^3.0.0
  firebase_analytics: ^13.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  firebase_performance: ^0.12.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  get_it: ^9.3.0
  hugeicons: ^1.2.0
  intl: ^0.20.3
  material_ui: ^1.8.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  wear_os_scrollbar: ^1.1.4

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  file: ^7.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  mocktail: ^1.0.5
  test_coverage_badge: ^0.3.2
  very_good_analysis: ^11.0.0

flutter_launcher_icons:
  android: "ic_logo"
  image_path_android: "assets/app-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app-logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/app-logo.png
    - assets/fonts/

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-VariableFont.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-VariableFont.ttf
        - asset: assets/fonts/Merriweather-Italic-VariableFont.ttf
          style: italic
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont.ttf
        - asset: assets/fonts/Montserrat-Italic-VariableFont.ttf
          style: italic
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-VariableFont.ttf
        - asset: assets/fonts/Nunito-Italic-VariableFont.ttf
          style: italic
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-VariableFont.ttf
        - asset: assets/fonts/OpenSans-Italic-VariableFont.ttf
          style: italic
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-VariableFont.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-VariableFont.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-VariableFont.ttf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont.ttf
        - asset: assets/fonts/Roboto-Italic-VariableFont.ttf
          style: italic
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-VariableFont.ttf
        - asset: assets/fonts/SourceCodePro-Italic-VariableFont.ttf
          style: italic
