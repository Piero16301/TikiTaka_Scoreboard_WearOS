name: tiki_taka_scoreboard_wearos
description: WearOS application for Tiki-Taka system for real-time scoreboard.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  bloc: ^9.0.1
  cloud_firestore: ^6.0.3
  dash_flags: ^0.1.1
  device_info_plus: ^12.1.0
  equatable: ^2.0.7
  fake_cloud_firestore: ^4.0.0
  firebase_core: ^4.1.1
  firebase_core_platform_interface: ^6.0.1
  firebase_messaging: ^16.0.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^19.4.2
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.3.2
  http: ^1.5.0
  hugeicons: ^1.1.1
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  plugin_platform_interface: ^2.1.8
  rotary_scrollbar: ^1.1.0
  shared_preferences: ^2.5.3
  shimmer_animation: ^2.2.2
  text_scroll: ^0.2.1
  user_api:
    path: packages/user_api
  user_api_remote:
    path: packages/user_api_remote
  user_repository:
    path: packages/user_repository
  vector_graphics: ^1.1.19
  vector_graphics_compiler: ^1.1.19
  wearable_rotary: ^2.0.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mockito: ^5.5.0
  mocktail: ^1.0.4
  test_coverage_badge: ^0.3.2
  very_good_analysis: ^10.0.0

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: "ic_logo"
  image_path_android: "assets/logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/logo.png
